# Programación en Python · AC Institut
# Jupyter Book 2 (motor MyST). Construir:  jupyter book build --html   (o  npx myst build --html)
version: 1
project:
  id: python-acinstitut
  title: Programación en Python
  subtitle: Ver el código pensar
  authors:
    - name: Antonio Chanes Espigares
  license: CC-BY-NC-SA-4.0
  github: https://github.com/antonychanes/python-acinstitut
  # Las celdas de código se pueden ejecutar en el propio navegador (JupyterLite + Pyodide)
  jupyter:
    lite: true
  exclude:
    - herramientas/**
    - README.md
    - node_modules/**
  toc:
    - file: index.md
    - file: capitulos/00-como-leer.md
    - title: Bloque 0 · Pensar antes de programar
      children:
        - file: capitulos/01-especificacion.md
        - file: capitulos/02-algoritmo.md
        - file: capitulos/03-trazas.md
    - title: Bloque 1 · Guardar y decidir
      children:
        - file: capitulos/04-variables-asignacion.md
        - file: capitulos/05-tipos-de-datos.md
        - file: capitulos/06-condicionales.md
    - title: Bloque 2 · Repetir
      children:
        - file: capitulos/07-bucles.md
        - file: capitulos/08-recorrer-listas.md
    - title: Bloque 3 · Organizar
      children:
        - file: capitulos/09-funciones.md
        - file: capitulos/10-cadenas.md
        - file: capitulos/11-diccionarios.md
    - title: Bloque 3+ · Todo el PCEP
      children:
        - file: capitulos/21-como-funciona-python.md
        - file: capitulos/22-listas-a-fondo.md
        - file: capitulos/23-tuplas-y-conjuntos.md
        - file: capitulos/24-funciones-a-fondo.md
        - file: capitulos/25-bucles-a-fondo.md
        - file: capitulos/26-cadenas-y-formato.md
        - file: capitulos/27-csv-math-random.md
    - title: Bloque 4 · Hacia el PCAP
      children:
        - file: capitulos/12-modulos.md
        - file: capitulos/13-excepciones.md
        - file: capitulos/14-clases.md
    - title: Bloque 5 · PCAP a fondo
      children:
        - file: capitulos/15-comprensiones.md
        - file: capitulos/16-funciones-valores.md
        - file: capitulos/17-ficheros.md
        - file: capitulos/18-clases-a-fondo.md
        - file: capitulos/19-cadenas-a-fondo.md
        - file: capitulos/20-probar-y-depurar.md
    - title: Practicar para el examen
      children:
        - file: capitulos/simulacro-pcep.md
        - file: capitulos/simulacro-pcap.md
site:
  template: book-theme
  options:
    logo_text: ac | institut · Python
    style: estilo/ac-institut.css
    folders: true
