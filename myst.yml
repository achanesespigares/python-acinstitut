# Programación en Python · AC Institut
# Jupyter Book 2 (motor MyST). Construir:  jupyter book build --html   (o  npx myst build --html)
version: 1
project:
  id: python-acinstitut
  title: Programación en Python
  subtitle: Ver el código pensar
  authors:
    - name: Antonio Chanes Espigares
  license: CC-BY-NC-SA-4.0
  github: https://github.com/antonychanes/python-acinstitut
  # Las celdas de código se pueden ejecutar en el propio navegador (JupyterLite + Pyodide)
  jupyter:
    lite: true
  exclude:
    - herramientas/**
    - README.md
    - node_modules/**
  toc:
    - file: index.md
    - file: capitulos/00-como-leer.md
    - title: Bloque 0 · Pensar antes de programar
      children:
        - file: capitulos/01-especificacion.md
        - file: capitulos/02-algoritmo.md
        - file: capitulos/03-trazas.md
    - title: Bloque 1 · Guardar y decidir
      children:
        - file: capitulos/04-variables-asignacion.md
        - file: capitulos/05-tipos-de-datos.md
        - file: capitulos/06-condicionales.md
    - title: Bloque 2 · Repetir
      children:
        - file: capitulos/07-bucles.md
        - file: capitulos/08-recorrer-listas.md
    - title: Bloque 3 · Organizar
      children:
        - file: capitulos/09-funciones.md
        - file: capitulos/10-cadenas.md
        - file: capitulos/11-diccionarios.md
site:
  template: book-theme
  options:
    logo_text: ac | institut · Python
    style: estilo/ac-institut.css
    folders: true
