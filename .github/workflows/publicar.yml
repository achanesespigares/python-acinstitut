# Publica el libro en GitHub Pages en cada push a main.
# Activa Pages en el repositorio: Settings → Pages → Source: GitHub Actions.
name: Publicar libro
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Dos trabajos, como recomienda GitHub: uno construye y sube la web; el otro la publica.
  construir:
    runs-on: ubuntu-latest
    env:
      # Dirección pública de la web, sin barra final: la usan el mapa del sitio, robots.txt y
      # las etiquetas para buscadores. Con dominio propio, p. ej. https://python.acinstitut.com
      SITIO: https://achanesespigares.github.io/python-acinstitut
      # Ruta bajo el dominio. Con dominio propio (la web en la raíz), borra esta línea
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar MyST (versión fijada en package.json)
        run: npm ci
      - name: Regenerar las trazas de los visualizadores
        run: npm run trazas
      - name: Construir el libro
        run: npx myst build --html
      - name: Copiar los bancos de preguntas a la web
        run: |
          cp -r datos _build/html/datos
          cp herramientas/trazar.py herramientas/laboratorio.py herramientas/diagrama.py widgets/diagrama.js _build/html/datos/
      - name: Copiar las diapositivas de cada sesión
        run: |
          mkdir -p _build/html/diapositivas
          cp diapositivas/pdf/ac-institut/*.pdf _build/html/diapositivas/
      - name: Copiar Python (Pyodide 314.0.7) para los dos laboratorios
        # Un solo Python para toda la web: lo usan el laboratorio del libro y «Mirar y ver».
        run: |
          mkdir -p _build/html/pyodide
          for f in pyodide.js pyodide.mjs pyodide.asm.mjs pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            curl -sSfL -o _build/html/pyodide/$f https://cdn.jsdelivr.net/npm/pyodide@314.0.7/$f
          done
      - name: Laboratorio «Mirar y ver · cómo piensa tu código»
        run: |
          mkdir -p _build/html/mirar-y-ver
          python3 mirar-y-ver/fuente/construir.py _build/html/mirar-y-ver/index.html
      - name: Mapa del sitio y robots.txt con la dirección real
        # MyST deja «http://pre.render» como dirección provisional; aquí se pone la de verdad y se
        # añade «Mirar y ver», que se construye aparte.
        run: |
          sed -i "s#http://pre.render#${SITIO}#g" _build/html/sitemap.xml _build/html/robots.txt
          sed -i "s#</urlset>#  <url>\n    <loc>${SITIO}/mirar-y-ver/</loc>\n  </url>\n</urlset>#" _build/html/sitemap.xml
          ! grep -q "pre.render" _build/html/sitemap.xml _build/html/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
