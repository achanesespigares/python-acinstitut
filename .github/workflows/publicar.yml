# Publica el libro en GitHub Pages en cada push a main.
# Activa Pages en el repositorio: Settings → Pages → Source: GitHub Actions.
name: Publicar libro
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Si publicas en un dominio propio (p. ej. python.acinstitut.com), borra esta línea
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar MyST (versión fijada en package.json)
        run: npm ci
      - name: Regenerar las trazas de los visualizadores
        run: npm run trazas
      - name: Construir el libro
        run: npx myst build --html
      - name: Copiar los bancos de preguntas a la web
        run: |
          cp -r datos _build/html/datos
          cp herramientas/trazar.py herramientas/laboratorio.py _build/html/datos/
      - name: Copiar las diapositivas de cada sesión
        run: |
          mkdir -p _build/html/diapositivas
          cp diapositivas/pdf/ac-institut/*.pdf _build/html/diapositivas/
      - name: Copiar Python (Pyodide) para el laboratorio
        run: |
          mkdir -p _build/html/pyodide
          for f in pyodide.js pyodide.asm.js pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            curl -sSfL -o _build/html/pyodide/$f https://cdn.jsdelivr.net/pyodide/v0.29.5/full/$f
          done
      - name: Laboratorio «Mirar y ver · cómo piensa tu código»
        run: |
          mkdir -p _build/html/mirar-y-ver/py
          python3 mirar-y-ver/fuente/construir.py _build/html/mirar-y-ver/index.html
          for f in pyodide.js pyodide.asm.mjs pyodide.asm.wasm python_stdlib.zip pyodide-lock.json; do
            curl -sSfL -o _build/html/mirar-y-ver/py/$f https://cdn.jsdelivr.net/npm/pyodide@314.0.7/$f
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
